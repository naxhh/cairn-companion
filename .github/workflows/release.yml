name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps and compile
        run: |
          npm install
          npm run build

      - name: Check that the tag version matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest_version" ]; then
            echo "The tag ($tag) does not match the version in manifest.json ($manifest_version)."
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p release/cairn-companion
          cp main.js manifest.json styles.css release/cairn-companion/
          cp -r data release/cairn-companion/data
          cd release && zip -r ../cairn-companion.zip cairn-companion

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css cairn-companion.zip
